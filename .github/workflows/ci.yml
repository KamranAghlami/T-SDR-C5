name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per event too: a manual Pages redeploy must not cancel a push build of the same ref.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build and run
        run: |
          cmake -S tests/host -B build-host -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-host -j
          ctest --test-dir build-host --output-on-failure

  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # stats: the same firmware with the per-second statistics log, for measurements.
        variant: [release, stats]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # esp-sdr only; its esp-dsp submodule is not used
          fetch-depth: 0 # git describe for the firmware version

      - name: Read pinned ESP-IDF commit
        id: idf
        run: |
          ref=$(tr -d '[:space:]' < idf-ref)
          upstream=$(python3 -I -c 'import json,sys; print(next(p["idf_ref"] for p in json.load(open(sys.argv[1]))["profiles"] if p["id"]=="esp32c5"))' third_party/esp-sdr/firmware-targets.json)
          if [ "$ref" != "$upstream" ]; then
            echo "::error file=idf-ref::idf-ref ($ref) differs from the ESP-SDR C5 pin ($upstream). The receiver relies on private PHY ABI offsets of that exact SDK."
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out ESP-IDF
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-idf
          ref: ${{ steps.idf.outputs.ref }}
          path: .esp-idf
          submodules: recursive

      - name: Cache SDK tools
        uses: actions/cache@v4
        with:
          path: ~/.espressif
          key: idf-${{ runner.os }}-${{ steps.idf.outputs.ref }}-esp32c5

      - name: Install SDK tools
        run: .esp-idf/install.sh esp32c5

      - name: Build
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          source .esp-idf/export.sh
          defaults="sdkconfig.defaults"
          version=$(git describe --tags --always --dirty)
          if [ "$VARIANT" = stats ]; then
            # The statistics are INFO messages; release builds compile those out.
            printf 'CONFIG_T_SDR_C5_STATS_LOG=y\nCONFIG_LOG_DEFAULT_LEVEL_INFO=y\n' > sdkconfig.stats
            defaults="$defaults;sdkconfig.stats"
            version="$version-stats" # shown in the boot log and the menu's About item
          fi
          idf.py -B build -DSDKCONFIG_DEFAULTS="$defaults" -DPROJECT_VER="$version" build
          idf.py -B build merge-bin -o "$PWD/build/merged.bin"

      - name: Check SRAM headroom
        run: |
          source .esp-idf/export.sh
          python3 -I tools/headroom.py build/T-SDR-C5.elf --min-kib 8 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Package
        run: |
          version=$(git describe --tags --always --dirty)
          out="dist/T-SDR-C5-$version"
          mkdir -p "$out"
          cp build/merged.bin "dist/T-SDR-C5-$version-merged.bin"
          cp build/bootloader/bootloader.bin build/partition_table/partition-table.bin build/T-SDR-C5.bin build/flash_args "$out/"
          python3 -I tools/offsets.py build/flash_args > "$out/offsets.json"
          (cd dist && tar -czf "T-SDR-C5-$version.tar.gz" "T-SDR-C5-$version" && rm -r "T-SDR-C5-$version")
          (cd dist && sha256sum * > SHA256SUMS)
          cp build/T-SDR-C5.elf build/T-SDR-C5.map dist/
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant == 'release' && 'firmware' || 'firmware-stats' }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host-tests, firmware]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*-merged.bin
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Browser flasher (web/index.html, esptool-js) on GitHub Pages, offering every release
  # (newest first, GitHub's latest preselected). Runs after a tag's release is
  # published; a manual run on a branch redeploys the page.
  pages:
    if: ${{ !failure() && !cancelled() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch every release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --exclude-drafts --limit 100 --json tagName,isPrerelease,isLatest,publishedAt > releases.json
          mkdir -p dist
          for tag in $(jq -r '.[].tagName' releases.json); do
            # Archives are T-SDR-C5-<tag>.tar.gz (t-sdr-c5-<tag>.tar.gz before the rename).
            if gh release download "$tag" --pattern "*-$tag.tar.gz" --dir "dist/$tag"; then
              for archive in dist/"$tag"/*.tar.gz; do tar -xzf "$archive" -C dist; done
            else
              echo "::warning::$tag has no firmware archive"
            fi
          done

      - name: Build site
        run: |
          python3 -I tools/web_site.py releases.json dist site
          cp web/index.html site/index.html
          cat site/versions.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
