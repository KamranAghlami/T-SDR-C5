name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build and run
        run: |
          cmake -S tests/host -B build-host -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-host -j
          ctest --test-dir build-host --output-on-failure

  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # stats: the same firmware with the per-second statistics log, for measurements.
        variant: [release, stats]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # esp-sdr only; its esp-dsp submodule is not used
          fetch-depth: 0 # git describe for the firmware version

      - name: Read pinned ESP-IDF commit
        id: idf
        run: |
          ref=$(tr -d '[:space:]' < idf-ref)
          upstream=$(python3 -I -c 'import json,sys; print(next(p["idf_ref"] for p in json.load(open(sys.argv[1]))["profiles"] if p["id"]=="esp32c5"))' third_party/esp-sdr/firmware-targets.json)
          if [ "$ref" != "$upstream" ]; then
            echo "::error file=idf-ref::idf-ref ($ref) differs from the ESP-SDR C5 pin ($upstream). The receiver relies on private PHY ABI offsets of that exact SDK."
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out ESP-IDF
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-idf
          ref: ${{ steps.idf.outputs.ref }}
          path: .esp-idf
          submodules: recursive

      - name: Cache SDK tools
        uses: actions/cache@v4
        with:
          path: ~/.espressif
          key: idf-${{ runner.os }}-${{ steps.idf.outputs.ref }}-esp32c5

      - name: Install SDK tools
        run: .esp-idf/install.sh esp32c5

      - name: Build
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          source .esp-idf/export.sh
          defaults="sdkconfig.defaults"
          if [ "$VARIANT" = stats ]; then
            echo "CONFIG_T_SDR_C5_STATS_LOG=y" > sdkconfig.stats
            defaults="$defaults;sdkconfig.stats"
          fi
          idf.py -B build -DSDKCONFIG_DEFAULTS="$defaults" build
          idf.py -B build merge-bin -o "$PWD/build/merged.bin"

      - name: Check SRAM headroom
        run: |
          source .esp-idf/export.sh
          python3 -I tools/headroom.py build/t_sdr_c5.elf --min-kib 8 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Package
        run: |
          version=$(git describe --tags --always --dirty)
          out="dist/t-sdr-c5-$version"
          mkdir -p "$out"
          cp build/merged.bin "dist/t-sdr-c5-$version-merged.bin"
          cp build/bootloader/bootloader.bin build/partition_table/partition-table.bin build/t_sdr_c5.bin build/flash_args "$out/"
          python3 -I tools/offsets.py build/flash_args > "$out/offsets.json"
          (cd dist && tar -czf "t-sdr-c5-$version.tar.gz" "t-sdr-c5-$version" && rm -r "t-sdr-c5-$version")
          (cd dist && sha256sum * > SHA256SUMS)
          cp build/t_sdr_c5.elf build/t_sdr_c5.map dist/
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant == 'release' && 'firmware' || 'firmware-stats' }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  # ESP Web Tools 10.4.0 bundles esptool-js 0.6.x, which can't detect ESP32-C5
  # revision 1.2 (the T-Display-C5's chip). Build the commit that moved to
  # esptool-js 0.7.0 until a release includes it; the pages job serves it.
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build ESP Web Tools
        env:
          EWT_REF: 384b35b1c34b5e279bb47fc82fe2482c6a98f899
        run: |
          git clone --quiet --filter=blob:none https://github.com/esphome/esp-web-tools .ewt
          git -C .ewt checkout --quiet "$EWT_REF"
          (cd .ewt && npm ci --no-audit --no-fund && script/build)
          # The ESP32-C5 v1.2 chip-detect magic (0x30e1706f) must be in the bundle.
          grep -rqiE '0x30e1706f|820080751' .ewt/dist/web/
          ls -l .ewt/dist/web | head

      - uses: actions/upload-artifact@v4
        with:
          name: esp-web-tools
          path: .ewt/dist/web/
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host-tests, firmware]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*-merged.bin
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Browser flasher (ESP Web Tools) on GitHub Pages. On a tag it serves that
  # release; a manual run on a branch rebuilds the page around the latest one.
  pages:
    if: ${{ !failure() && !cancelled() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    needs: [release, web]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: esp-web-tools
          path: esp-web-tools

      - name: Fetch release images
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="$REF_NAME"; else version=$(gh release view --json tagName --jq .tagName); fi
          gh release download "$version" --pattern "t-sdr-c5-$version.tar.gz" --dir dist
          tar -xzf "dist/t-sdr-c5-$version.tar.gz" -C dist
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build site
        run: |
          mkdir -p site/firmware
          cp dist/t-sdr-c5-$VERSION/*.bin site/firmware/
          python3 -I tools/web_manifest.py "dist/t-sdr-c5-$VERSION/offsets.json" --version "$VERSION" > site/manifest.json
          sed "s/{{VERSION}}/$VERSION/" web/index.html > site/index.html
          cp -r esp-web-tools site/esp-web-tools
          cat site/manifest.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
